name: Renderprove

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      advisory:
        description: Run optional Gemma advisory when Cloudflare secrets are configured
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Prepare production preview
        run: |
          mkdir -p .renderprove-ci
          set -o pipefail
          npm run renderprove:prepare 2>&1 | tee .renderprove-ci/prepare.log

      - name: Check out pinned Renderprove
        uses: actions/checkout@v5
        with:
          repository: teamleaderleo/renderprove
          ref: d7032fe6d8fa9ee692bd6d0e2e8ec291150dabb8
          path: .renderprove-tool
          persist-credentials: false

      - name: Build pinned worker image
        run: |
          playwright_version="$(node -p "require('./.renderprove-tool/package.json').dependencies.playwright")"
          docker build \
            --build-arg "PLAYWRIGHT_VERSION=${playwright_version}" \
            --file .renderprove-tool/build/worker/Containerfile \
            --tag renderprove-worker:emoji \
            .renderprove-tool

      - name: Review production preview
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' renderprove-worker:emoji)"

          docker run --rm --init --ipc=host --network=none \
            --user "$(id -u):$(id -g)" \
            --cap-drop=ALL --security-opt no-new-privileges \
            --pids-limit=768 --memory=2g --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --entrypoint node \
            --env RENDERPROVE_WORKER_IMAGE=renderprove-worker:emoji \
            --env "RENDERPROVE_WORKER_IMAGE_ID=${image_id}" \
            renderprove-worker:emoji \
            /opt/renderprove/scripts/worker-identity.mjs \
            > .renderprove-ci/worker.json

          node -e "const value=require('./.renderprove-ci/worker.json'); if (value.version !== 1 || value.browser?.name !== 'chromium' || !value.fonts?.sha256) process.exit(1)"

          set +e
          docker run --rm --init --ipc=host --network=none \
            --user "$(id -u):$(id -g)" \
            --cap-drop=ALL --security-opt no-new-privileges \
            --pids-limit=768 --memory=2g --cpus=2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --volume "${GITHUB_WORKSPACE}:/workspace/project:rw" \
            renderprove-worker:emoji \
            review /workspace/project --output .renderprove-ci --json \
            > .renderprove-ci/review.stdout.json \
            2> .renderprove-ci/review.stderr.txt
          status=$?
          set -e

          cat .renderprove-ci/review.stderr.txt
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi

          node -e "const value=require('./.renderprove-ci/receipt.json'); if (value.status !== 'passed' || value.cases?.length !== 2 || !value.cases.every((item) => item.artifacts?.some((artifact) => artifact.kind === 'screenshot' && artifact.sha256?.length === 64))) process.exit(1)"

      - name: Detect Gemma advisory eligibility
        id: gemma-eligibility
        env:
          ELIGIBLE_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          ADVISORY_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.advisory }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          enabled=false
          reason=credentials-missing
          if [ "${ELIGIBLE_SOURCE}" != 'true' ]; then
            reason=fork-pull-request
          elif [ "${ADVISORY_REQUESTED}" != 'true' ]; then
            reason=manual-disabled
          elif [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] && [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            enabled=true
            reason=ready
          fi
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Gemma advisory review
        if: steps.gemma-eligibility.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          node .renderprove-tool/bin/renderprove.mjs advise . \
            --receipt .renderprove-ci/receipt.json \
            --output .renderprove-ci \
            --include src \
            --include package.json \
            --include package-lock.json \
            --include tsconfig.json \
            --include README.md \
            --include scripts/prepare-renderprove.sh \
            --include .github/workflows/renderprove.yml \
            --json \
            > .renderprove-ci/advice.stdout.json \
            2> .renderprove-ci/advice.stderr.txt
          status=$?

          if [ "${status}" -eq 0 ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const advicePath = '.renderprove-ci/advice.json';
          const advice = JSON.parse(fs.readFileSync(advicePath, 'utf8'));
          if (advice.version !== 1 || advice.authoritative !== false || !['clear', 'concern', 'unknown'].includes(advice.verdict)) {
            throw new Error('invalid advice artifact');
          }
          const status = {
            version: 1,
            status: 'available',
            advice: 'advice.json',
            model: advice.model,
            verdict: advice.verdict,
            findings: advice.findings.length,
            usage: advice.usage,
          };
          fs.writeFileSync('.renderprove-ci/advice-status.json', `${JSON.stringify(status, null, 2)}\n`);
          const tokens = advice.usage?.total_tokens ?? 'unknown';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Gemma advisory\n\n- Status: available\n- Verdict: ${advice.verdict}\n- Findings: ${advice.findings.length}\n- Model: \`${advice.model}\`\n- Tokens: ${tokens}\n`);
          NODE
            status=$?
          fi
          set -e

          if [ "${status}" -ne 0 ]; then
            node -e "require('node:fs').writeFileSync('.renderprove-ci/advice-status.json', JSON.stringify({version:1,status:'unavailable',reason:'provider-or-structured-output-error',exitCode:Number(process.argv[1])}, null, 2) + '\n')" "${status}"
            echo '::warning title=Gemma advisory unavailable::The deterministic browser receipt passed, but the optional provider call or structured output failed. See the retained advisory diagnostics.'
            {
              echo '### Gemma advisory'
              echo
              echo '- Status: unavailable'
              echo '- Deterministic browser evidence: passed'
              echo '- Diagnostics: `advice.stderr.txt` in the retained artifact'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Record skipped Gemma advisory
        if: steps.gemma-eligibility.outputs.enabled != 'true'
        env:
          REASON: ${{ steps.gemma-eligibility.outputs.reason }}
        run: |
          node -e "require('node:fs').writeFileSync('.renderprove-ci/advice-status.json', JSON.stringify({version:1,status:'skipped',reason:process.env.REASON || 'ineligible'}, null, 2) + '\n')"
          {
            echo '### Gemma advisory'
            echo
            echo '- Status: skipped'
            echo "- Reason: ${REASON:-ineligible}"
            echo '- Deterministic browser evidence: passed'
          } >> "${GITHUB_STEP_SUMMARY}"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoji-mood-renderprove
          path: .renderprove-ci
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
